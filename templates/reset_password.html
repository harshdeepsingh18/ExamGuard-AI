{% extends "base.html" %}
{% block title %}Choose New Password | ExamGuard AI{% endblock %}
{% block content %}
<main class="login-section">
    <div class="badge">ACCOUNT RECOVERY</div>
    <h1>Choose a new <span>password</span></h1>
    <p>Use at least 8 characters for your new password.</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" class="auth-form">
        <input type="hidden" name="access_token" id="access_token" value="{{ access_token|default('') }}">
        <input type="hidden" name="refresh_token" id="refresh_token" value="{{ refresh_token|default('') }}">
        <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
        <div class="field"><label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></div>
        <button class="primary-btn" type="submit">Update password</button>
    </form>
</main>
{% endblock %}
{% block scripts %}<script>
    const authParams = new URLSearchParams(window.location.hash.slice(1));
    document.getElementById('access_token').value = authParams.get('access_token') || '';
    document.getElementById('refresh_token').value = authParams.get('refresh_token') || '';
</script>{% endblock %}
