{% extends "base.html" %}
{% block title %}Profile & Settings | ExamGuard AI{% endblock %}
{% block content %}
<main class="login-section">
    <div class="badge">ACCOUNT SETTINGS</div><h1>Your <span>profile</span></h1>
    <form method="post" class="auth-form">
        <div class="field"><label for="full_name">Full name</label><input id="full_name" name="full_name" value="{{ profile.full_name }}" maxlength="120" autocomplete="name" required></div>
        <div class="field"><label>Email address</label><input value="{{ session.get('email', '') or '' }}" disabled aria-label="Email address"></div>
        <div class="field"><label>Account type</label><input value="{{ profile.role|title }}{% if profile.requested_role == 'teacher' and not profile.teacher_approved %} · Teacher approval pending{% endif %}" disabled aria-label="Account type"></div>
        <button class="primary-btn" type="submit">Save Profile</button>
    </form>
    <p><a class="text-link" href="{{ url_for('forgot_password') }}">Send a password reset link</a></p>
</main>
{% endblock %}
